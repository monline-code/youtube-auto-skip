<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px 16px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #1f1f1f;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .label { font-size: 13px; }
    .count {
      font-size: 13px;
      color: #555;
    }
    .count b { color: #c00; font-size: 15px; }
    /* 开关样式 */
    .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #ccc; border-radius: 24px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #d32f2f; }
    input:checked + .slider::before { transform: translateX(18px); }
    .hint { font-size: 11px; color: #999; margin-top: 10px; line-height: 1.5; }
    .reset {
      font-size: 11px; color: #1a73e8; background: none; border: none;
      cursor: pointer; padding: 0; margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>YouTube 自动跳过广告</h1>
  <div class="row">
    <span class="label">自动跳过</span>
    <label class="switch">
      <input type="checkbox" id="toggle" aria-label="自动跳过广告" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="row">
    <span class="label">调试日志</span>
    <label class="switch">
      <input type="checkbox" id="debug" aria-label="调试日志" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="count">已累计自动跳过：<b id="skipped">0</b> 次</div>
  <button class="reset" id="reset">清零计数</button>
  <div class="hint">提示：仅点击 YouTube 官方提供的「跳过广告」按钮，不会屏蔽广告本身。遇到倒计时结束时才会点击。开启「调试日志」后，到 YouTube 页面按 F12 看控制台输出，可帮助定位未跳过的问题。</div>
  <script src="popup.js"></script>
</body>
</html>
